<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的相册</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#1a1a1a;color:#fff;font-family:system-ui,sans-serif;padding:20px;}
h1{text-align:center;margin-bottom:30px;}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;max-width:1400px;margin:0 auto;}
.gallery img{width:100%;height:220px;object-fit:cover;border-radius:8px;cursor:pointer;transition:0.2s;}
.gallery img:hover{transform:scale(1.02);}

/* 大图弹窗 */
.lightbox{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:999;}
.lightbox-img-wrap{max-width:90%;max-height:calc(100% - 120px);}
.lightbox img{max-width:100%;max-height:100%;border-radius:4px;transition:transform 0.3s;}
.lightbox .toolbar{margin-top:20px;display:flex;gap:12px;}
.lightbox button{padding:8px 16px;font-size:16px;border:none;border-radius:6px;cursor:pointer;background:#444;color:#fff;}
.lightbox .close{position:absolute;top:20px;right:30px;color:#fff;font-size:36px;cursor:pointer;}
</style>
</head>
<body>
<h1>相册</h1>
<div class="gallery" id="gallery"></div>
<div class="lightbox" id="lightbox">
  <span class="close" onclick="closeLightbox()">×</span>
  <div class="lightbox-img-wrap">
    <img id="lightImg">
  </div>
  <div class="toolbar">
    <button onclick="rotateLeft()">↺ 左旋</button>
    <button onclick="rotateRight()">↻ 右旋</button>
    <button onclick="downloadImage()">⬇ 下载</button>
  </div>
</div>

<script>
// ========== 密码设置 ==========
const PASSWORD = "123456"; // 修改引号内文字更换密码
// ========== 图片列表 ==========
const IMAGE_LIST = [
  {src:"images/aisi.jpg", name:"aisi.jpg"},
  {src:"images/xiaohei.jpg", name:"xiaohei.jpg"},
];

let currentImageSrc = "";
let currentImageName = "";
let rotateDeg = 0;

// 密码校验
function checkPwd(){
  const input = prompt("请输入相册密码：");
  if(input === PASSWORD){
    renderGallery();
  }else{
    alert("密码错误！");
    document.body.innerHTML = "<h1>无权访问</h1>";
  }
}

// 渲染画廊
function renderGallery(){
  const galleryEl = document.getElementById("gallery");
  IMAGE_LIST.forEach(item=>{
    const img = document.createElement('img');
    img.src = item.src;
    img.alt = item.name;
    img.onclick = ()=>openLightbox(item.src, item.name);
    galleryEl.appendChild(img);
  })
}

// 打开大图弹窗
function openLightbox(src, name){
  currentImageSrc = src;
  currentImageName = name;
  rotateDeg = 0;
  document.getElementById("lightImg").src = src;
  document.getElementById("lightImg").style.transform = `rotate(${rotateDeg}deg)`;
  document.getElementById("lightbox").style.display = "flex";
}

// 旋转
function rotateLeft(){
  rotateDeg -=90;
  document.getElementById("lightImg").style.transform = `rotate(${rotateDeg}deg)`;
}
function rotateRight(){
  rotateDeg +=90;
  document.getElementById("lightImg").style.transform = `rotate(${rotateDeg}deg)`;
}

// 下载图片
function downloadImage(){
  const a = document.createElement('a');
  a.href = currentImageSrc;
  a.download = currentImageName;
  a.click();
}

// 关闭弹窗
function closeLightbox(){
  document.getElementById("lightbox").style.display = "none";
}

// 页面加载触发密码
checkPwd();
</script>
</body>
</html>
