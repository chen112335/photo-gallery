<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Seedream Gallery</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    background:
      radial-gradient(circle at 20% 10%, rgba(126, 77, 255, 0.35), transparent 26%),
      radial-gradient(circle at 80% 20%, rgba(80, 160, 255, 0.28), transparent 28%),
      radial-gradient(circle at 50% 90%, rgba(180, 90, 255, 0.18), transparent 30%),
      #07080d;
    color: #f5f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", sans-serif;
    padding: 48px 24px 80px;
  }

  .page-header {
    max-width: 1400px;
    margin: 0 auto 42px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    padding-bottom: 18px;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 14px;
  }

  h1 {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 4px;
    color: #ffffff;
    background: linear-gradient(120deg, #a78bfa 0%, #60a5fa 45%, #22d3ee 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    font-size: 13px;
    letter-spacing: 6px;
    color: #9aa0b4;
    text-transform: uppercase;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #22d3ee;
    box-shadow: 0 0 12px #22d3ee;
  }

  .status-text {
    font-size: 12px;
    color: #8b93a7;
    letter-spacing: 2px;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .gallery {
    max-width: 1400px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 18px;
  }

  .gallery-item {
    position: relative;
    overflow: hidden;
    border-radius: 18px;
    background: #11141c;
    aspect-ratio: 4 / 3;
    box-shadow:
      0 10px 30px rgba(0, 0, 0, 0.45),
      0 0 0 1px rgba(255, 255, 255, 0.04) inset;
    cursor: pointer;
    transition: transform 0.4s ease, box-shadow 0.4s ease;
  }

  .gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.5s ease;
  }

  .gallery-item:hover {
    transform: translateY(-6px);
    box-shadow:
      0 20px 45px rgba(126, 77, 255, 0.35),
      0 0 0 1px rgba(167, 139, 250, 0.35) inset;
  }

  .gallery-item:hover img {
    transform: scale(1.08);
  }

  .gallery-item::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      180deg,
      rgba(0, 0, 0, 0) 40%,
      rgba(0, 0, 0, 0.45) 100%
    );
    opacity: 0;
    transition: opacity 0.35s ease;
    pointer-events: none;
  }

  .gallery-item:hover::after {
    opacity: 1;
  }

  .item-title {
    position: absolute;
    left: 14px;
    right: 14px;
    bottom: 12px;
    font-size: 13px;
    letter-spacing: 2px;
    color: #ffffff;
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.35s ease;
    z-index: 2;
  }

  .gallery-item:hover .item-title {
    opacity: 1;
    transform: translateY(0);
  }

  /* 大图弹窗 */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(5, 6, 11, 0.96);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 24px;
  }

  .lightbox.active {
    display: flex;
  }

  .lightbox::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(126, 77, 255, 0.18), transparent 30%),
      radial-gradient(circle at 80% 70%, rgba(34, 211, 238, 0.15), transparent 30%);
    pointer-events: none;
  }

  .lightbox-main {
    position: relative;
    max-width: 92%;
    max-height: 78%;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }

  .lightbox img {
    max-width: 100%;
    max-height: 78vh;
    border-radius: 16px;
    box-shadow:
      0 25px 60px rgba(0, 0, 0, 0.7),
      0 0 0 1px rgba(255, 255, 255, 0.06);
    transition: transform 0.3s ease;
    background: #000;
  }

  .close {
    position: absolute;
    top: 18px;
    right: 22px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    font-size: 22px;
    line-height: 44px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s ease;
    z-index: 10;
  }

  .close:hover {
    background: rgba(255, 80, 80, 0.95);
    transform: rotate(90deg);
  }

  .toolbar {
    margin-top: 28px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    z-index: 2;
  }

  .toolbar button {
    min-width: 104px;
    padding: 12px 18px;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 2px;
    color: #fff;
    background: linear-gradient(135deg, #1f2430, #2a2f3a);
    border: 1px solid rgba(167, 139, 250, 0.4);
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .toolbar button:hover {
    background: linear-gradient(135deg, #3b4254, #4c5470);
    border-color: #a78bfa;
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(126, 77, 255, 0.35);
  }

  .toolbar button:active {
    transform: translateY(0);
  }

  .footer-tip {
    text-align: center;
    margin-top: 60px;
    color: #6c7180;
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  @media (max-width: 640px) {
    h1 {
      font-size: 24px;
      letter-spacing: 2px;
    }

    .subtitle {
      font-size: 11px;
      letter-spacing: 3px;
    }

    .gallery {
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }

    .toolbar button {
      min-width: 84px;
      padding: 10px 14px;
      font-size: 13px;
    }
  }
</style>
</head>

<body>
  <header class="page-header">
    <div class="brand">
      <h1>Seedream Gallery</h1>
      <span class="subtitle">Private Archive</span>
    </div>

    <div class="header-right">
      <span class="status-dot"></span>
      <span class="status-text">LIVE</span>
    </div>
  </header>

  <main class="gallery" id="gallery"></main>

  <div class="footer-tip">Curated Moments · Private Gallery</div>

  <div class="lightbox" id="lightbox">
    <span class="close" id="closeBtn" title="关闭">×</span>

    <div class="lightbox-main">
      <img id="lightImg" alt="大图预览" />
    </div>

    <div class="toolbar">
      <button id="rotateLeftBtn">↺ 左旋</button>
      <button id="rotateRightBtn">↻ 右旋</button>
      <button id="downloadBtn">⬇ 下载原图</button>
    </div>
  </div>

  <script>
    // ========== 密码设置 ==========
    const PASSWORD = "123456"; // 修改这里更换密码

    // ========== 图片列表 ==========
    const IMAGE_LIST = [
      { src: "images/aisi.jpg", name: "aisi.jpg" },
      { src: "images/xiaohei.jpg", name: "xiaohei.jpg" }
    ];

    let currentImageSrc = "";
    let currentImageName = "";
    let rotateDeg = 0;

    // 密码校验
    function checkPwd() {
      const input = prompt("请输入相册密码：");

      if (input !== null && input === PASSWORD) {
        renderGallery();
      } else {
        alert("密码错误！");
        document.body.innerHTML = `
          <div style="
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:
              radial-gradient(circle at 20% 20%, rgba(126,77,255,0.25), transparent 30%),
              radial-gradient(circle at 80% 80%, rgba(34,211,238,0.22), transparent 30%),
              #07080d;
            color:#fff;
            font-size:20px;
            letter-spacing:4px;">
            无权访问
          </div>`;
      }
    }

    // 渲染画廊
    function renderGallery() {
      const galleryEl = document.getElementById("gallery");

      IMAGE_LIST.forEach((item, index) => {
        const wrap = document.createElement("div");
        wrap.className = "gallery-item";

        const img = document.createElement("img");
        img.src = item.src;
        img.alt = item.name;
        img.loading = "lazy";

        const title = document.createElement("div");
        title.className = "item-title";
        title.textContent =
          "IMAGE " + String(index + 1).padStart(3, "0");

        wrap.appendChild(img);
        wrap.appendChild(title);
        wrap.addEventListener("click", () =>
          openLightbox(item.src, item.name)
        );

        galleryEl.appendChild(wrap);
      });
    }

    // 打开大图
    function openLightbox(src, name) {
      currentImageSrc = src;
      currentImageName = name;
      rotateDeg = 0;

      const img = document.getElementById("lightImg");
      img.src = src;
      img.style.transform = `rotate(${rotateDeg}deg)`;

      document.getElementById("lightbox").classList.add("active");
    }

    // 关闭大图
    function closeLightbox() {
      document.getElementById("lightbox").classList.remove("active");
    }

    // 旋转
    function rotateLeft() {
      rotateDeg -= 90;
      document.getElementById("lightImg").style.transform =
        `rotate(${rotateDeg}deg)`;
    }

    function rotateRight() {
      rotateDeg += 90;
      document.getElementById("lightImg").style.transform =
        `rotate(${rotateDeg}deg)`;
    }

    // 下载
    function downloadImage() {
      if (!currentImageSrc) return;

      const a = document.createElement("a");
      a.href = currentImageSrc;
      a.download = currentImageName || "photo.jpg";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    // 绑定按钮
    document.getElementById("closeBtn").addEventListener("click", closeLightbox);
    document
      .getElementById("rotateLeftBtn")
      .addEventListener("click", rotateLeft);
    document
      .getElementById("rotateRightBtn")
      .addEventListener("click", rotateRight);
    document
      .getElementById("downloadBtn")
      .addEventListener("click", downloadImage);

    // 点击遮罩关闭
    document.getElementById("lightbox").addEventListener("click", (e) => {
      if (e.target.id === "lightbox") closeLightbox();
    });

    // 页面加载触发密码
    checkPwd();
  </script>
</body>
</html>
